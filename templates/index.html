<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cati & Diel ❤️</title>
    <!-- Fonte elegante e romântica do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-lilac: #e8dff5;
            --card-white: #ffffff;
            --text-color: #4a3e56;
            --accent-purple: #9d81ba;
            --accent-hover: #8363a3;
            --shadow: 0 10px 30px rgba(157, 129, 186, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-lilac);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Corações decorativos de fundo */
        .heart-bg {
            position: fixed;
            top: -10px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            user-select: none;
            pointer-events: none;
            animation: fall 8s linear infinite;
            z-index: 0;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Cabecalho */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--accent-purple);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #6c5b7b;
        }

        /* Contador de Tempo */
        .timer-card {
            background: var(--card-white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 40px;
        }

        .timer-card h2 {
            font-size: 1.5rem;
            color: var(--accent-purple);
            margin-bottom: 20px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .timer-box {
            background: var(--bg-lilac);
            padding: 15px 10px;
            border-radius: 12px;
        }

        .timer-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-purple);
        }

        .timer-box label {
            font-size: 0.85rem;
            color: #6c5b7b;
            text-transform: uppercase;
        }

        /* Secoes Gerais */
        section {
            background: var(--card-white);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        section h2 {
            font-size: 1.8rem;
            color: var(--accent-purple);
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        section h2::after {
            content: '♥️';
            display: block;
            font-size: 1rem;
            margin-top: 5px;
        }

        /* Galeria de Fotos */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: #fff;
            border: 1px solid #f0e6fa;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo-card p {
            padding: 15px;
            font-size: 0.95rem;
            color: #5a4b6e;
            text-align: center;
        }

        /* Players de Musica */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .music-card {
            background: var(--bg-lilac);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .music-card h3 {
            font-size: 1.1rem;
            color: var(--accent-purple);
            margin-bottom: 15px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporcao 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Rodape */
        footer {
            text-align: center;
            padding: 25px;
            background: var(--card-white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            font-size: 1.05rem;
            color: var(--accent-purple);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Coracoes de fundo -->
    <div class="heart-bg" style="left: 10%; animation-delay: 0s;">🌸</div>
    <div class="heart-bg" style="left: 25%; animation-delay: 2s;">💖</div>
    <div class="heart-bg" style="left: 50%; animation-delay: 4s;">✨</div>
    <div class="heart-bg" style="left: 75%; animation-delay: 1s;">💜</div>
    <div class="heart-bg" style="left: 85%; animation-delay: 3s;">🤍</div>

    <div class="container">
        <!-- Cabecalho -->
        <header>
            <h1>Cati & Diel</h1>
            <p>A nossa história guardada em um só lugar ✨</p>
        </header>

        <!-- Contador -->
        <div class="timer-card">
            <h2>Juntos Há</h2>
            <div class="timer-grid">
                <div class="timer-box"><span id="days">0</span><label>Dias</label></div>
                <div class="timer-box"><span id="hours">0</span><label>Horas</label></div>
                <div class="timer-box"><span id="minutes">0</span><label>Minutos</label></div>
                <div class="timer-box"><span id="seconds">0</span><label>Segundos</label></div>
            </div>
        </div>

        <!-- Galeria de Fotos -->
        <section>
            <h2>Nossas Memórias</h2>
            <div class="gallery-grid">
                {% for photo in photos %}
                <div class="photo-card">
                    <img src="{{ url_for('static', filename='photos/' + photo.file) }}" alt="Foto de Cati e Diel">
                    <p>{{ photo.caption }}</p>
                </div>
                {% endfor %}
            </div>
        </section>

        <!-- Musicas -->
        <section>
            <h2>Nossas Músicas</h2>
            <div class="music-grid">
                {% for song in songs %}
                <div class="music-card">
                    <h3>{{ song.title }}</h3>
                    <div class="video-container">
                        <iframe 
                            src="https://www.youtube.com/embed/{{ song.youtube_id }}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
                {% endfor %}
            </div>
        </section>

        <!-- Rodape -->
        <footer>
            Feito com amor para Cati, pelo o seu branquinho.
        </footer>
    </div>

    <!-- Script da contagem de tempo -->
    <script>
        const START_DATE = new Date("2026-06-16T00:00:00-03:00");

        function updateTimer() {
            const now = new Date();
            const diff = now - START_DATE;

            if (diff < 0) {
                document.getElementById("days").innerText = "0";
                document.getElementById("hours").innerText = "0";
                document.getElementById("minutes").innerText = "0";
                document.getElementById("seconds").innerText = "0";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
